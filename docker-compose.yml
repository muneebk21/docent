services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docent}
      POSTGRES_USER: ${POSTGRES_USER:-docent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docent}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
